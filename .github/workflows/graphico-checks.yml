name: Graphico Node.js syntax checks

on:
  push:
    paths:
      - "server.js"
      - "backend/server.js"
      - "package.json"
      - "backend/package.json"
      - ".github/workflows/graphico-checks.yml"
  pull_request:
    paths:
      - "server.js"
      - "backend/server.js"
      - "package.json"
      - "backend/package.json"
      - ".github/workflows/graphico-checks.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check root server syntax
        run: node --check server.js
      - name: Check backend server syntax
        run: node --check backend/server.js
